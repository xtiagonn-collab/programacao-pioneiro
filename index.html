    --card-2:#212A37;
    --line:#2A3441;
    --gold:#E0B15C;
    --gold-soft:#332913;
    --gold-2:#EAC375;
    --teal:#5FA391;
    --teal-2:#71BAA5;
    --teal-soft:#16241F;
    --danger:#E08468;
    --success:#4FBE83;
    --success-soft:#123322;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.25), 0 1px 1px rgba(0,0,0,0.2);
    --shadow-md:0 6px 16px -4px rgba(0,0,0,0.45), 0 2px 6px -2px rgba(0,0,0,0.3);
    --shadow-lg:0 14px 32px -10px rgba(0,0,0,0.55), 0 4px 10px -4px rgba(0,0,0,0.35);
    --shadow-teal:0 8px 20px -6px rgba(95,163,145,0.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{ transition:background-color .25s ease; }
  body{
    background:
      radial-gradient(1100px 480px at 12% -8%, rgba(58,106,94,0.07), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(184,134,46,0.08), transparent 55%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:48px;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }

  /* Topbar */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 16px 14px;
    max-width:560px;
    margin:0 auto;
    position:sticky;
    top:0;
    z-index:15;
    background:rgba(247,245,240,0.82);
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
  }
  .back-btn{
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--line);
    border-radius:11px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:0 13px 0 9px;
    font-family:'Inter',sans-serif;
    font-size:0.86rem;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    line-height:1;
    flex-shrink:0;
    box-shadow:var(--shadow-sm);
    transition:transform .15s var(--ease), background .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .back-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .back-btn:active{ background:var(--teal-soft); border-color:var(--teal); transform:scale(0.94); box-shadow:none; }
  .darkmode-btn{
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--line);
    border-radius:11px;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    cursor:pointer;
    padding:0;
    flex-shrink:0;
    margin-left:auto;
    box-shadow:var(--shadow-sm);
    transition:transform .15s var(--ease), background .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .darkmode-btn svg{ width:19px; height:19px; }
  .darkmode-btn:active{ background:var(--gold-soft); border-color:var(--gold); transform:scale(0.92); box-shadow:none; }
  .darkmode-btn .icon-moon{ display:none; }
  :root.dark .darkmode-btn .icon-sun{ display:none; }
  :root.dark .darkmode-btn .icon-moon{ display:block; }
  .topbar h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:1.15rem;
    margin:0;
    letter-spacing:-0.015em;
  }

  .view{ }

  /* Home */
  .home-hero{
    text-align:center;
    padding:6px 20px 8px;
  }
  .home-hero p{
    margin:2px 0 0;
    color:var(--ink-soft);
    font-size:0.92rem;
    letter-spacing:0.01em;
  }
  .nav-grid{
    max-width:560px;
    margin:20px auto 0;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .nav-card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    background:linear-gradient(165deg,var(--card) 0%,var(--card-2) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    text-align:left;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    box-shadow:var(--shadow-md);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .nav-card:active{
    transform:scale(0.98) translateY(1px);
    box-shadow:var(--shadow-sm);
    background:linear-gradient(165deg,var(--teal-soft) 0%,var(--card) 100%);
  }
  .nav-card .nav-icon{
    width:48px; height:48px;
    border-radius:13px;
    background:linear-gradient(150deg,var(--teal-soft) 0%,#d7e9e2 100%);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    color:var(--teal);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 6px -2px rgba(58,106,94,0.25);
  }
  .nav-card .nav-icon svg{ width:23px; height:23px; }
  .nav-card .nav-text{ flex:1; min-width:0; }
  .nav-card .nav-text h2{
    font-family:'Inter',sans-serif;
    font-size:1.08rem;
    margin:0 0 2px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .nav-card .nav-text p{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin:0;
    line-height:1.35;
  }
  .nav-card .nav-arrow{
    margin-left:auto;
    color:var(--ink-soft);
    font-size:1.3rem;
    flex-shrink:0;
  }

  /* Name field */
  .name-field{
    max-width:560px;
    margin:20px auto 0;
    padding:0 16px;
  }
  .name-field label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--ink-soft);
    font-weight:600;
    display:block;
    margin-bottom:7px;
  }
  .name-field input{
    width:100%;
    border:1px solid var(--line);
    border-radius:11px;
    padding:13px 15px;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    background:var(--card);
    color:var(--ink);
    box-shadow:var(--shadow-sm);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .name-field input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(58,106,94,0.12); }

  .totals{
    max-width:560px;
    margin:18px auto 0;
    padding:0 16px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .total-card{
    background:linear-gradient(165deg,var(--card) 0%,var(--card-2) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:17px 14px;
    text-align:center;
    box-shadow:var(--shadow-md);
  }
  .total-card .label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:600;
  }
  .total-card .value{
    font-family:'JetBrains Mono',monospace;
    font-size:1.8rem;
    font-weight:700;
    background:linear-gradient(165deg,var(--teal) 0%,var(--teal-2) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-top:3px;
    letter-spacing:-0.01em;
  }
  .total-card.month .value{ background:linear-gradient(165deg,var(--gold) 0%,var(--gold-2) 100%); -webkit-background-clip:text; background-clip:text; }

  .bars{
    max-width:560px;
    margin:14px auto 0;
    padding:16px 16px 15px;
    background:linear-gradient(165deg,var(--card) 0%,var(--card-2) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-left:16px; margin-right:16px;
    box-shadow:var(--shadow-md);
  }
  .bars .bars-title{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:12px;
  }
  .bar-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    font-size:0.75rem;
  }
  .bar-row .day-abbr{ width:28px; color:var(--ink-soft); font-weight:600; flex-shrink:0;}
  .bar-track{
    flex:1;
    height:9px;
    background:var(--paper);
    border-radius:6px;
    overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(36,49,66,0.08);
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--gold-2));
    border-radius:6px;
    transition:width .4s var(--ease);
    box-shadow:0 0 6px rgba(184,134,46,0.25);
  }
  .bar-row .bar-val{ width:38px; text-align:right; color:var(--ink-soft); flex-shrink:0; font-weight:500;}

  main{
    max-width:560px;
    margin:20px auto 0;
    padding:0 16px;
  }

  .day-card{
    background:linear-gradient(165deg,var(--card) 0%,var(--card-2) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:var(--shadow-md);
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .day-card.open{ box-shadow:var(--shadow-lg); }
  .day-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 16px;
    cursor:pointer;
    user-select:none;
  }
  .day-head .day-name{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:-0.01em;
  }
  .day-head .day-sub{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .day-head .day-hours{
    font-size:0.85rem;
    font-weight:600;
    color:var(--teal);
    background:var(--teal-soft);
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .day-head .day-hours.zero{ color:var(--ink-soft); background:var(--paper); }
  .chevron{
    width:9px;height:9px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    transition:transform .25s var(--ease);
    flex-shrink:0;
  }
  .day-card.open .chevron{ transform:rotate(-135deg); }

  .day-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s var(--ease);
  }
  .day-card.open .day-body{ max-height:2000px; }

  .entries{ padding:0 16px; }
  .entry{
    border-top:1px solid var(--line);
    padding:13px 0;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .entry .time-field{
    display:flex;
    flex-direction:column;
    gap:3px;
    flex:1;
    min-width:90px;
  }
  .entry label{
    font-size:0.65rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    font-weight:600;
  }
  .digital-input{
    display:flex;
    align-items:center;
    gap:4px;
    border:1px solid var(--line);
    border-radius:9px;
    padding:7px 8px;
    background:var(--paper);
    width:100%;
    box-shadow:inset 0 1px 2px rgba(36,49,66,0.05);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .digital-input input{
    border:none;
    background:transparent;
    outline:none;
    width:22px;
    text-align:center;
    font-family:'Inter',monospace;
    font-variant-numeric:tabular-nums;
    font-size:1rem;
    font-weight:600;
    color:var(--ink);
    padding:2px 0;
  }
  .digital-input input::placeholder{ color:var(--ink-soft); opacity:.5; }
  .digital-input .colon{
    font-weight:700;
    color:var(--ink-soft);
  }
  .digital-input:focus-within{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(58,106,94,0.12);
  }
  .entry select{
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 8px;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    background:var(--paper);
    color:var(--ink);
    width:100%;
    flex-basis:100%;
  }
  .entry-modality-wrap{
    display:flex;
    flex-direction:column;
    gap:3px;
    flex-basis:100%;
  }
  .entry-bottom-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-basis:100%;
    margin-top:2px;
  }
  .entry-dur{
    font-size:0.8rem;
    font-weight:600;
    color:var(--gold);
  }
  .remove-entry{
    background:none;
    border:none;
    color:var(--danger);
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    padding:4px 6px;
  }

  .add-entry-btn{
    display:block;
    width:calc(100% - 32px);
    margin:10px 16px 16px;
    padding:11px;
    background:var(--paper);
    border:1.5px dashed var(--line);
    border-radius:11px;
    color:var(--ink-soft);
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .15s var(--ease);
  }
  .add-entry-btn:active{ background:var(--gold-soft); border-color:var(--gold); transform:scale(0.98); }

  .empty-day{
    padding:12px 0;
    color:var(--ink-soft);
    font-size:0.85rem;
    border-top:1px solid var(--line);
  }

  /* Serviço page */
  .service-hero{
    max-width:560px;
    margin:14px auto 0;
    padding:0 16px;
  }
  .service-total-card{
    background:linear-gradient(160deg,var(--card) 0%,var(--card-2) 60%,var(--teal-soft) 160%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 18px 20px;
    text-align:center;
    box-shadow:var(--shadow-md);
  }
  .service-total-card .label{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--ink-soft);
    font-weight:600;
  }
  .service-total-card .value{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:2.7rem;
    background:linear-gradient(165deg,var(--teal) 0%,var(--teal-2) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-top:4px;
    letter-spacing:-0.01em;
  }
  .service-total-card .sub{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:8px;
    font-weight:500;
  }
  .service-total-card .sub b{ color:var(--gold); }

  .service-year-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:16px;
  }
  .service-year-nav button{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    width:34px;
    height:34px;
    font-size:1.1rem;
    color:var(--teal);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow-sm);
    transition:transform .15s var(--ease), background .15s ease;
  }
  .service-year-nav button:active{ background:var(--teal-soft); transform:scale(0.92); }
  .service-year-nav button:disabled{ opacity:0.35; cursor:default; }
  .service-year-nav .current-period-btn{
    width:auto;
    padding:0 14px;
    font-size:0.8rem;
    font-weight:600;
    color:var(--ink);
    background:var(--card);
  }

  .estudos-field{
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-top:1px solid var(--line);
  }
  .estudos-field label{
    font-size:0.9rem;
    font-weight:600;
    color:var(--ink);
  }
  .estudos-field input{
    width:104px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:11px;
    padding:13px 10px;
    font-family:'Inter',sans-serif;
    font-size:1.15rem;
    font-weight:600;
    background:var(--paper);
    color:var(--ink);
    box-shadow:inset 0 1px 2px rgba(36,49,66,0.05);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .estudos-field input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(58,106,94,0.12); }

  .calendar-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    padding:14px 10px 6px;
    border-top:1px solid var(--line);
  }
  .calendar-weekdays .wk{
    text-align:center;
    font-size:0.62rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.02em;
    font-weight:700;
    line-height:1.1;
  }
  .calendar-weekdays .wk.weekend{
    color:var(--gold);
    background:var(--gold-soft);
    border-radius:7px;
    padding:3px 0;
  }

  .day-hours-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    padding:2px 10px 10px;
  }
  .day-hour-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding-top:2px;
    border-radius:9px;
  }
  .day-hour-cell.blank{ visibility:hidden; }
  .day-hour-cell .dnum{
    font-size:0.72rem;
    color:var(--ink-soft);
    font-weight:700;
    line-height:1.1;
  }
  .day-hour-cell.weekend .dnum{ color:var(--gold); }
  .day-hour-cell.weekend{ background:var(--gold-soft); }
  .day-hour-cell .input-wrap{
    position:relative;
    width:100%;
  }
  .day-hour-cell input{
    width:100%;
    text-align:center;
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 2px;
    font-family:'Inter',monospace;
    font-size:0.95rem;
    font-weight:600;
    background:var(--paper);
    color:var(--ink);
    box-shadow:inset 0 1px 2px rgba(36,49,66,0.05);
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .day-hour-cell input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(58,106,94,0.12); }
  .day-hour-cell.has-value input{
    border-color:var(--gold);
    background:var(--card);
    font-weight:700;
    box-shadow:none;
  }

  .month-report-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:calc(100% - 32px);
    margin:16px 16px 16px;
    padding:12px;
    background:linear-gradient(165deg,var(--teal-2) 0%,var(--teal) 100%);
    color:#fff;
    border:none;
    border-radius:11px;
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    box-shadow:var(--shadow-teal);
    transition:transform .15s var(--ease), box-shadow .15s ease;
  }
  .month-report-btn:active{ transform:scale(0.98); box-shadow:var(--shadow-sm); }
  .month-report-btn svg{ width:16px; height:16px; flex-shrink:0; }

  /* Stopwatch */
  .stopwatch{
    max-width:560px;
    margin:14px 16px 0;
    background:linear-gradient(160deg,var(--card) 0%,var(--card-2) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 16px 18px;
    text-align:center;
    box-shadow:var(--shadow-md);
  }
  .stopwatch .bars-title{ text-align:left; }
  .sw-status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin:10px 0 2px;
    padding:5px 12px;
    border-radius:20px;
    background:var(--paper);
    border:1px solid var(--line);
    font-family:'Inter',sans-serif;
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink-soft);
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .sw-status-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--ink-soft);
    flex-shrink:0;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .sw-status.running{
    background:var(--success-soft);
    border-color:var(--success);
    color:var(--success);
  }
  .sw-status.running .sw-status-dot{
    background:var(--success);
    box-shadow:0 0 0 4px rgba(46,139,87,0.18);
    animation:sw-pulse 1.4s ease-in-out infinite;
  }
  @keyframes sw-pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.3); }
  }
  .stopwatch .sw-display{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-weight:800;
    font-size:2.9rem;
    color:var(--ink);
    margin:10px 0 20px;
    letter-spacing:0.01em;
    transition:color .2s ease;
  }
  .stopwatch .sw-display.running{
    background:linear-gradient(165deg,var(--success) 0%,#3fae70 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sw-buttons{

<script>
const DAYS = [
  {key:'dom', name:'Domingo', abbr:'Dom'},
  {key:'seg', name:'Segunda-feira', abbr:'Seg'},
  {key:'ter', name:'Terça-feira', abbr:'Ter'},
  {key:'qua', name:'Quarta-feira', abbr:'Qua'},
  {key:'qui', name:'Quinta-feira', abbr:'Qui'},
  {key:'sex', name:'Sexta-feira', abbr:'Sex'},
  {key:'sab', name:'Sábado', abbr:'Sáb'},
];
const MODALITIES = ['Cartas', 'TPL', 'TPE', 'Estudo/Revisita', 'Casa em Casa'];
const MONTH_NAMES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const STORAGE_PROGRAMACAO = 'programacao-semanal';
const STORAGE_PIONEER = 'pioneiro-nome';
const STORAGE_SERVICO = 'servico-meses';

let state = {};       // programação semanal { dom: [{id,start,end,mod}], ... }
let openDay = null;
let servicoState = {}; // { "2026-09": {days:{1:2.5,...}, estudos:3}, ... }
let openMonth = null;
let pioneerName = '';

/* ---------------- Router ---------------- */
const VIEWS = ['home','programacao','servico','contagem'];
const VIEW_TITLES = {home:'Programação do Pioneiro', programacao:'Programação', servico:'Serviço', contagem:'Contagem'};

function showView(name){
  VIEWS.forEach(v => {
    const el = document.getElementById('view-'+v);
    if(el) el.style.display = (v === name) ? '' : 'none';
  });
  document.getElementById('backBtn').style.display = (name === 'home') ? 'none' : 'flex';
  document.getElementById('topbarTitle').textContent = VIEW_TITLES[name];
  window.scrollTo(0,0);
}

/* ---------------- Modo escuro ---------------- */
const STORAGE_DARKMODE = 'pioneiro-modo-escuro';
function applyDarkMode(on){
  document.documentElement.classList.toggle('dark', on);
}
function toggleDarkMode(){
  const on = !document.documentElement.classList.contains('dark');
  applyDarkMode(on);
  try{ localStorage.setItem(STORAGE_DARKMODE, on ? '1' : '0'); }catch(e){}
}
function loadDarkMode(){
  let saved = null;
  try{ saved = localStorage.getItem(STORAGE_DARKMODE); }catch(e){}
  const on = saved === null
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    : saved === '1';
  applyDarkMode(on);
}

/* ---------------- Utilidades gerais ---------------- */
function uid(){ return Math.random().toString(36).slice(2, 9); }

function showToast(){
  const t = document.getElementById('savedToast');
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1200);
}

/* ================= PROGRAMAÇÃO ================= */
function emptyState(){
  const s = {};
  DAYS.forEach(d => s[d.key] = []);
  return s;
}

function minutesBetween(start, end){
  if(!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if(mins < 0) mins += 24 * 60;
  return mins;
}

function fmtHours(mins){
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  if(m === 0) return h + 'h';
  return h + 'h' + String(m).padStart(2,'0');
}

function fmtDecHours(h){
  const totalMin = Math.round((h || 0) * 60);
  const hh = Math.floor(totalMin / 60);
  const mm = totalMin % 60;
  if(mm === 0) return hh + 'h';
  return hh + 'h' + String(mm).padStart(2,'0');
}

function dayMinutes(dayKey){
  return (state[dayKey] || []).reduce((sum, e) => sum + minutesBetween(e.start, e.end), 0);
}

function weekMinutes(){
  return DAYS.reduce((sum, d) => sum + dayMinutes(d.key), 0);
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_PROGRAMACAO, JSON.stringify(state));
    showToast();
  }catch(e){
    console.error('Erro ao salvar', e);
  }
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_PROGRAMACAO);
    if(raw){
      const parsed = JSON.parse(raw);
      state = emptyState();
      DAYS.forEach(d => { if(Array.isArray(parsed[d.key])) state[d.key] = parsed[d.key]; });
    } else {
      state = emptyState();
    }
  }catch(e){
    state = emptyState();
  }
}

function savePioneerName(v){
  pioneerName = v;
  try{ localStorage.setItem(STORAGE_PIONEER, v); }catch(e){}
}

function loadPioneerName(){
  try{
    pioneerName = localStorage.getItem(STORAGE_PIONEER) || '';
  }catch(e){ pioneerName = ''; }
  const input = document.getElementById('pioneerNameInput');
  if(input) input.value = pioneerName;
}

function addEntry(dayKey){
  state[dayKey].push({id: uid(), start:'', end:'', mod: MODALITIES[0]});
  saveState();
  render();
}

function removeEntry(dayKey, id){
  state[dayKey] = state[dayKey].filter(e => e.id !== id);
  saveState();
  render();
}

function updateEntry(dayKey, id, field, value){
  const entry = state[dayKey].find(e => e.id === id);
  if(entry){ entry[field] = value; }
  saveState();
  renderTotalsOnly();
  renderEntryDurations(dayKey);
  renderDayHeaderHours(dayKey);
}

function renderTotalsOnly(){
  const wk = weekMinutes();
  document.getElementById('weekTotal').textContent = fmtHours(wk);
  document.getElementById('monthTotal').textContent = fmtHours(wk * 4);
  renderBars();
}

function renderBars(){
  const container = document.getElementById('barsList');
  const dayMinsList = DAYS.map(d => dayMinutes(d.key));
  const max = Math.max(...dayMinsList, 60);
  container.innerHTML = DAYS.map((d, i) => {
    const mins = dayMinsList[i];
    const pct = Math.round((mins / max) * 100);
    return `<div class="bar-row">
      <span class="day-abbr">${d.abbr}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
      <span class="bar-val">${mins > 0 ? fmtHours(mins) : '—'}</span>
    </div>`;
  }).join('');
}

function renderDayHeaderHours(dayKey){
  const el = document.querySelector(`.day-hours[data-day="${dayKey}"]`);
  if(!el) return;
  const mins = dayMinutes(dayKey);
  el.textContent = mins > 0 ? fmtHours(mins) : '0h';
  el.classList.toggle('zero', mins === 0);
}

function renderEntryDurations(dayKey){
  (state[dayKey] || []).forEach(e => {
    const el = document.querySelector(`.entry-dur[data-entry="${e.id}"]`);
    if(el){
      const mins = minutesBetween(e.start, e.end);
      el.textContent = mins > 0 ? fmtHours(mins) : '';
    }
  });
}

function modalityOptions(selected){
  return MODALITIES.map(m => `<option value="${m}" ${m === selected ? 'selected' : ''}>${m}</option>`).join('');
}

function splitTime(value){
  if(value && /^\d{1,2}:\d{1,2}$/.test(value)){
    const [h, m] = value.split(':');
    return {hh: h.padStart(2,'0'), mm: m.padStart(2,'0')};
  }
  return {hh:'', mm:''};
}

function digitalTimeField(dayKey, entryId, field, labelText, value){
  const {hh, mm} = splitTime(value);
  return `
    <div class="time-field">
      <label>${labelText}</label>
      <div class="digital-input">
        <input type="text" inputmode="numeric" maxlength="2" placeholder="--"
          value="${hh}"
          data-day="${dayKey}" data-entry="${entryId}" data-field="${field}" data-part="hh"
          oninput="handleTimePart(this)" onblur="handleTimeBlur(this)">
        <span class="colon">:</span>
        <input type="text" inputmode="numeric" maxlength="2" placeholder="--"
          value="${mm}"
          data-day="${dayKey}" data-entry="${entryId}" data-field="${field}" data-part="mm"
          oninput="handleTimePart(this)" onblur="handleTimeBlur(this)">
      </div>
    </div>`;
}

function handleTimePart(input){
  let digits = input.value.replace(/\D/g, '').slice(0, 2);
  input.value = digits;
  if(digits.length === 2){
    const max = input.dataset.part === 'hh' ? 23 : 59;
    if(parseInt(digits, 10) > max){
      digits = String(max);
      input.value = digits;
    }
    const row = input.closest('.digital-input');
    const inputs = row.querySelectorAll('input');
    if(input.dataset.part === 'hh'){
      inputs[1].focus();
      inputs[1].select();
    } else {
      commitTime(input);
      input.blur();
    }
  }
}

function handleTimeBlur(input){
  if(input.value.length === 1){
    input.value = input.value.padStart(2, '0');
  }
  commitTime(input);
}

function commitTime(input){
  const {day, entry, field} = input.dataset;
  const row = input.closest('.digital-input');
  const inputs = row.querySelectorAll('input');
  const hh = inputs[0].value;
  const mm = inputs[1].value;
  const combined = (hh.length === 2 && mm.length === 2) ? `${hh}:${mm}` : '';
  updateEntry(day, entry, field, combined);
}

function entryHTML(dayKey, entry){
  return `
  <div class="entry" data-entry-row="${entry.id}">
    ${digitalTimeField(dayKey, entry.id, 'start', 'Início', entry.start)}
    ${digitalTimeField(dayKey, entry.id, 'end', 'Fim', entry.end)}
    <div class="entry-modality-wrap">
      <label>Modalidade</label>
      <select onchange="updateEntry('${dayKey}','${entry.id}','mod',this.value)">
        ${modalityOptions(entry.mod)}
      </select>
    </div>
    <div class="entry-bottom-row">
      <span class="entry-dur" data-entry="${entry.id}">${minutesBetween(entry.start, entry.end) > 0 ? fmtHours(minutesBetween(entry.start, entry.end)) : ''}</span>
      <button class="remove-entry" onclick="removeEntry('${dayKey}','${entry.id}')">Remover</button>
    </div>
  </div>`;
}

function dayCardHTML(day){
  const entries = state[day.key] || [];
  const mins = dayMinutes(day.key);
  const isOpen = openDay === day.key;
  return `
  <div class="day-card ${isOpen ? 'open' : ''}" data-daycard="${day.key}">
    <div class="day-head" onclick="toggleDay('${day.key}')">
      <span class="day-name">${day.name}</span>
      <span class="day-sub">
        <span class="day-hours ${mins === 0 ? 'zero' : ''}" data-day="${day.key}">${mins > 0 ? fmtHours(mins) : '0h'}</span>
        <span class="chevron"></span>
      </span>
    </div>
    <div class="day-body">
      <div class="entries">
        ${entries.length === 0 ? '<div class="empty-day">Nenhum horário adicionado.</div>' : entries.map(e => entryHTML(day.key, e)).join('')}
      </div>
      <button class="add-entry-btn" onclick="addEntry('${day.key}')">+ Adicionar horário</button>
    </div>
  </div>`;
}

function toggleDay(dayKey){
  openDay = (openDay === dayKey) ? null : dayKey;
  render();
}

function render(){
  document.getElementById('daysList').innerHTML = DAYS.map(dayCardHTML).join('');
  renderTotalsOnly();
}

function buildWhatsAppMessage(){
  const lines = [];
  lines.push('*Programação do Pioneiro*');
  lines.push('');
  DAYS.forEach(d => {
    const entries = state[d.key] || [];
    if(entries.length === 0) return;
    lines.push(`*${d.name}*`);
    entries.forEach(e => {
      if(!e.start || !e.end) return;
      const mins = minutesBetween(e.start, e.end);
      lines.push(`  ${e.start} às ${e.end} — ${e.mod} (${fmtHours(mins)})`);
    });
    lines.push(`  Total do dia: ${fmtHours(dayMinutes(d.key))}`);
    lines.push('');
  });
  const wk = weekMinutes();
  lines.push(`*Total semanal:* ${fmtHours(wk)}`);
  lines.push(`*Total mensal (4 semanas):* ${fmtHours(wk * 4)}`);
  return lines.join('\n');
}

document.getElementById('waBtn').addEventListener('click', () => {
  const text = buildWhatsAppMessage();
  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
});

/* ================= SERVIÇO ================= */
function currentServiceYearStart(){
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth(); // 0-indexed; 8 = Setembro
  return (m >= 8) ? y : y - 1;
}

let selectedServiceYearStart = currentServiceYearStart();

function changeServiceYear(delta){
  selectedServiceYearStart += delta;
  openMonth = null;
  renderServico();
}

function goToCurrentServiceYear(){
  selectedServiceYearStart = currentServiceYearStart();
  openMonth = null;
  renderServico();
}

function serviceMonthsList(startYear = selectedServiceYearStart){
  const months = [];
  for(let i = 0; i < 12; i++){
    const monthIndex = (8 + i) % 12;
    const year = startYear + Math.floor((8 + i) / 12);
    const key = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
    months.push({key, monthIndex, year});
  }
  return months;
}

function daysInMonth(year, monthIndex){
  return new Date(year, monthIndex + 1, 0).getDate();
}

function ensureMonth(key){
  if(!servicoState[key]) servicoState[key] = {days:{}, estudos:0};
  return servicoState[key];
}

function monthTotalHours(key){
  const m = servicoState[key];
  if(!m) return 0;
  return Object.values(m.days).reduce((s, h) => s + (parseFloat(h) || 0), 0);
}

function yearTotalHours(startYear = selectedServiceYearStart){
  return serviceMonthsList(startYear).reduce((s, mo) => s + monthTotalHours(mo.key), 0);
}

async function saveServicoState(){
  try{
    localStorage.setItem(STORAGE_SERVICO, JSON.stringify(servicoState));
    showToast();
  }catch(e){
    console.error('Erro ao salvar', e);
  }
}

function loadServicoState(){
  try{
    const raw = localStorage.getItem(STORAGE_SERVICO);
    servicoState = raw ? JSON.parse(raw) : {};
  }catch(e){
    servicoState = {};
  }
}

function updateServiceDay(key, day, value){
  ensureMonth(key);
  const v = value === '' ? '' : parseFloat(value);
  if(v === '' || isNaN(v)){
    delete servicoState[key].days[day];
  } else {
    servicoState[key].days[day] = v;
  }
  saveServicoState();
  renderServico();
}

function updateServiceEstudos(key, value){
  ensureMonth(key);
  const v = value === '' ? 0 : parseInt(value, 10);
  servicoState[key].estudos = isNaN(v) ? 0 : v;
  saveServicoState();
  renderServico();
}

function toggleMonth(key){
  openMonth = (openMonth === key) ? null : key;
  renderServico();
}

function monthCardHTML(mo){
  const key = mo.key;
  const total = monthTotalHours(key);
  const isOpen = openMonth === key;
  const dim = daysInMonth(mo.year, mo.monthIndex);
  const monthData = servicoState[key] || {days:{}, estudos:0};

  // Semana começando na segunda-feira: 0=Seg ... 6=Dom
  const firstJsWeekday = new Date(mo.year, mo.monthIndex, 1).getDay(); // 0=Dom...6=Sáb
  const leadingBlanks = (firstJsWeekday + 6) % 7;

  const dayCells = [];
  for(let i = 0; i < leadingBlanks; i++){
    dayCells.push(`<div class="day-hour-cell blank" aria-hidden="true"></div>`);
  }
  for(let d = 1; d <= dim; d++){
    const rawVal = monthData.days[d];
    const val = (rawVal !== undefined && rawVal !== '') ? rawVal : '';
    const weekday = new Date(mo.year, mo.monthIndex, d).getDay(); // 0=dom ... 6=sáb
    const weekdayAbbr = DAYS[weekday].abbr;
    const isWeekend = (weekday === 0 || weekday === 6);
    dayCells.push(`
      <div class="day-hour-cell ${val !== '' ? 'has-value' : ''} ${isWeekend ? 'weekend' : ''}">
        <span class="dnum">${d}</span>
        <span class="input-wrap">
          <input type="number" inputmode="decimal" min="0" max="24" step="0.5" value="${val}"
            aria-label="Horas em ${weekdayAbbr}, dia ${d}"
            onchange="updateServiceDay('${key}', ${d}, this.value)">
        </span>
      </div>`);
  }
  const totalCells = leadingBlanks + dim;
  const trailingBlanks = (7 - (totalCells % 7)) % 7;
  for(let i = 0; i < trailingBlanks; i++){
    dayCells.push(`<div class="day-hour-cell blank" aria-hidden="true"></div>`);
  }

  return `
  <div class="day-card ${isOpen ? 'open' : ''}" data-monthcard="${key}">
    <div class="day-head" onclick="toggleMonth('${key}')">
      <span class="day-name">${MONTH_NAMES_PT[mo.monthIndex]} ${mo.year}</span>
      <span class="day-sub">
        <span class="day-hours ${total === 0 ? 'zero' : ''}">${total > 0 ? fmtDecHours(total) : '0h'}</span>
        <span class="chevron"></span>
      </span>
    </div>
    <div class="day-body">
      <div class="estudos-field">
        <label>Estudos no mês</label>
        <input type="number" inputmode="numeric" min="0" step="1" value="${monthData.estudos || ''}" placeholder="0"
          onchange="updateServiceEstudos('${key}', this.value)">
      </div>
      <div class="calendar-weekdays">
        <span class="wk">Seg</span><span class="wk">Ter</span><span class="wk">Qua</span><span class="wk">Qui</span><span class="wk">Sex</span><span class="wk weekend">Sáb</span><span class="wk weekend">Dom</span>
      </div>
      <div class="day-hours-grid">${dayCells.join('')}</div>
      <button class="month-report-btn" onclick="sendMonthReport('${key}')">
        <svg viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.001 2C6.478 2 2 6.477 2 12c0 1.876.52 3.632 1.42 5.133L2 22l5.021-1.395A9.958 9.958 0 0012 22c5.523 0 10-4.477 10-10S17.524 2 12.001 2zm0 18.03a8.01 8.01 0 01-4.29-1.244l-.307-.183-3.164.879.85-3.11-.2-.319A8.003 8.003 0 1120 12c0 4.42-3.58 8.03-7.999 8.03z"/></svg>
        Enviar relatório do mês
      </button>
    </div>
  </div>`;
}

function renderServico(){
  const startYear = selectedServiceYearStart;
  document.getElementById('serviceYearTotal').textContent = fmtDecHours(yearTotalHours(startYear));
  document.getElementById('serviceYearLabel').innerHTML = `Set/${String(startYear).slice(-2)} – Ago/${String(startYear + 1).slice(-2)}`;
  document.getElementById('monthsList').innerHTML = serviceMonthsList(startYear).map(monthCardHTML).join('');

  const isCurrent = (startYear === currentServiceYearStart());
  const currentBtn = document.getElementById('serviceYearCurrentBtn');
  if(currentBtn){
    currentBtn.textContent = isCurrent ? 'Ano atual' : 'Ir para o ano atual';
  }

  renderHomeServiceSummary();
}

function renderHomeServiceSummary(){
  const startYear = currentServiceYearStart();
  const total = document.getElementById('homeServiceTotal');
  const period = document.getElementById('homeServicePeriod');
  if(total) total.textContent = fmtDecHours(yearTotalHours(startYear));
  if(period) period.textContent = `Set/${String(startYear).slice(-2)} – Ago/${String(startYear + 1).slice(-2)}`;
}

function sendMonthReport(key){
  const mo = serviceMonthsList().find(m => m.key === key);
  if(!mo) return;
  const total = monthTotalHours(key);
  const estudos = (servicoState[key] && servicoState[key].estudos) || 0;
  const monthName = MONTH_NAMES_PT[mo.monthIndex];
  const text = `Prezado irmão, envio o meu relatório:\n\nMês: ${monthName} de ${mo.year}\nHoras: ${fmtDecHours(total)}\nEstudos: ${estudos}\n\nAtenciosamente,\n${pioneerName}`;
  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

/* ================= CONTAGEM (Cronômetro) ================= */
let swElapsed = 0;
let swStartedAt = null;
let swInterval = null;
let swState = 'idle'; // idle | running | paused | stopped

function swFormat(ms){
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
}

function swTick(){
  const now = Date.now();
  const current = swElapsed + (now - swStartedAt);
  document.getElementById('swDisplay').textContent = swFormat(current);
}

function swUpdateButtons(){
  const startBtn = document.getElementById('swStartBtn');
  const pauseBtn = document.getElementById('swPauseBtn');
  const stopBtn = document.getElementById('swStopBtn');
  const resetBtn = document.getElementById('swResetBtn');
  const display = document.getElementById('swDisplay');

  display.classList.toggle('running', swState === 'running');

  const statusEl = document.getElementById('swStatus');
  const statusText = document.getElementById('swStatusText');
  if(statusEl && statusText){
    statusEl.classList.toggle('running', swState === 'running');
    const labels = {idle:'Parado', running:'Em execução', paused:'Pausado', stopped:'Finalizado'};
    statusText.textContent = labels[swState] || 'Parado';
  }

  startBtn.disabled = (swState === 'running' || swState === 'stopped');
  pauseBtn.disabled = (swState !== 'running');
  stopBtn.disabled = (swState !== 'running' && swState !== 'paused');
  resetBtn.disabled = (swState === 'running' || swState === 'idle');
}

function swStart(){
  if(swState === 'running' || swState === 'stopped') return;
  swState = 'running';
  swStartedAt = Date.now();
  swInterval = setInterval(swTick, 250);
  swUpdateButtons();
}

function swPause(){
  if(swState !== 'running') return;
  swElapsed += Date.now() - swStartedAt;
  clearInterval(swInterval);
  swState = 'paused';
  document.getElementById('swDisplay').textContent = swFormat(swElapsed);
  swUpdateButtons();
}

function swStop(){
  if(swState !== 'running' && swState !== 'paused') return;
  if(swState === 'running'){
    swElapsed += Date.now() - swStartedAt;
  }
  clearInterval(swInterval);
  swState = 'stopped';
  document.getElementById('swDisplay').textContent = swFormat(swElapsed);
  swUpdateButtons();
}

function swReset(){
  if(swState === 'running' || swState === 'idle') return;
  clearInterval(swInterval);
  swElapsed = 0;
  swStartedAt = null;
  swState = 'idle';
  document.getElementById('swDisplay').textContent = '00:00:00';
  swUpdateButtons();
}

/* ================= Adicionar à tela inicial ================= */
let deferredInstallPrompt = null;

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

function showInstallSteps(stepsHTML){
  document.getElementById('installSteps').innerHTML = stepsHTML;
  document.getElementById('installModal').classList.add('show');
}

document.getElementById('installBtn').addEventListener('click', async () => {
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    return;
  }
  if(isIOS()){
    showInstallSteps(`
      <li>Toque no ícone de <b>compartilhar</b> (o quadrado com a seta para cima), na barra do Safari</li>
      <li>Role para baixo e toque em <b>"Adicionar à Tela de Início"</b></li>
      <li>Toque em <b>"Adicionar"</b> no canto superior direito</li>
    `);
  } else {
    showInstallSteps(`
      <li>Toque nos <b>três pontinhos (⋮)</b> no canto superior direito do navegador</li>
      <li>Toque em <b>"Adicionar à tela inicial"</b> (ou "Instalar app")</li>
      <li>Confirme tocando em <b>"Adicionar"</b></li>
    `);
  }
});

document.getElementById('installModalClose').addEventListener('click', () => {
  document.getElementById('installModal').classList.remove('show');
});
document.getElementById('installModal').addEventListener('click', (e) => {
  if(e.target.id === 'installModal') e.target.classList.remove('show');
});

if(isStandalone()){
  document.getElementById('installBtn').style.display = 'none';
  document.getElementById('footerNote').textContent = 'A programação fica salva neste dispositivo automaticamente.';
}

if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

(async function init(){
  loadDarkMode();
  await loadState();
  loadPioneerName();
  loadServicoState();
  render();
  renderServico();
  showView('home');
})();
</script>
